features:
    - fetcher
    - catalog
    - mapper
    - poster
fetcher_config:
    type: native_php
    file: Fetcher.php
    class: "ItIsAllMail\\Driver\\DummyFetcherDriver"
    poster_proxy: ""
    fetcher_proxy: ""
catalog_config:
    type: native_php
    file: Catalog.php
    class: "ItIsAllMail\\Driver\\DummyCatalogDriver"
    mailbox_base_dir: 
    mailbox: catalog
mapper_config:
    type: native_php
    file: Mapper.php
    class: "ItIsAllMail\\Driver\\DummyAddressMapper"
poster_config:
    type: native_php
    file: Poster.php
    class: "ItIsAllMail\\Driver\\DummyPoster"
